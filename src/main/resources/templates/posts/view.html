<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 읽기</title>
    <!-- Bootstrap CSS 추가 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<script>
	function confirmDelete(postId){
		if (confirm("진짜삭제? ㄹㅇ?")) {
			
			/* URL 이동 기능 */
			location.href = '/posts/remove/' + postId;
		
		}
	}

</script>
<body>
<!-- 네비게이션 바 -->
<div th:replace="~{navi :: navi}"></div>

<div class="container my-5">
    <h2>게시글 읽기</h2>

    <!-- 게시글 상세 내용 -->
    <div class="card">
        <div class="card-header">
            <!-- 게시글 제목 -->
             <h3 th:text ="${post.title}">제목</h3>
        </div>
        <div class="card-body">
            <!-- 게시글 내용 -->
             <p th:text = "${post.content}">내용</p>
        </div>
        <div class="card-footer text-muted">
            <!-- 게시글 작성자, 조회수, 등록일 -->
            <span th:text = "${post.user.username}" ></span> |
            <span th:text = "${post.views}"></span>
            <span th:text = "${#temporals.format(post.createTime, 'dd-MM-yyy')}" >작성일: 2025-01-20</span>
        </div>
   </div>

    <!-- 로그인 사용자가 작성사용자가 같을 경우에만 수정,삭제 버튼이 보여야한다 -->
    <th:block th:if="${session.loginUser!= null and session.loginUser.id == post.user.id}" >
    <button type="button" class="btn btn-danger" th:onclick="|confirmDelete(${post.id})|">삭제하기</button>
	</th:block>
    <!-- 뒤로 가기 버튼 -->
    <a href="/posts" class="btn btn-secondary mt-3">목록으로 돌아가기</a>
	</div>

<!-- Bootstrap JS 및 의존성 스크립트 추가 -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
