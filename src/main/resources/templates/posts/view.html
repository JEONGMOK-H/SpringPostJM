<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 읽기</title>
    <!-- Bootstrap CSS 추가 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<!-- 네비게이션 바 -->
<div th:replace="~{navi :: navi}"></div>

<div class="container my-5">
    <h2>게시글 읽기</h2>

    <!-- 게시글 상세 내용 -->
    <th:block th:object="${post}">
    <div class="card">
        <div class="card-header">
            <!-- 게시글 제목 -->
             <h3 th:text="*{title}">제목</h3>
        </div>
        <div class="card-body">
            <!-- 게시글 내용 -->
             <p th:text="*{content}" >내용</p>
        </div>
        <div class="card-footer text-muted">
            <!-- 게시글 작성자, 조회수, 등록일 -->
            <span th:text="*{user.username}" >작성자: 홍길동</span> |
            <span th:text="*{views}" >조회 수: 5</span> |
            <span th:text="*{createTime}">작성일: 2025-01-20</span>
        </div>
    </div>
    </th:block>

    <!-- 뒤로 가기 버튼 -->
    <th:block th:if="${session.loginUser}">
        <a th:href="@{edit/{postId}(postId=${post.id})}" class="btn btn-secondary mt-3">수정하기</a>
        <a th:href="@{remove/{postId}(postId=${post.id})}" class="btn btn-danger mt-3">삭제하기</a>
    </th:block>
    <a href="/posts" class="btn btn-secondary mt-3">목록으로 돌아가기</a>
</div>

<!-- Bootstrap JS 및 의존성 스크립트 추가 -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
