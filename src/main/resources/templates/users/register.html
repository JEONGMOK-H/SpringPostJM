<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <!-- Bootstrap CSS 추가 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<!-- 네비게이션 바 -->
<div th:replace="~{navi :: navi}"></div>

<div class="container my-5">
    <h2>회원가입</h2>

    <!-- 회원가입 폼 -->
    <form action="/users/register" method="post" th:object="${registerUserDto}">
        <!-- 유효성 검사 메시지를 표시할 영역 -->
        <div class="mb-3">
            <label for="username" class="form-label">아이디</label>
            <input type="text" class="form-control" th:field="*{username}" required>
            <button class="btn btn-secondary mt-3" onclick="alert('버튼을 클릭했습니다!')">중복체크</button>
            <div th:if="${#fields.hasErrors('username')}" class="alert alert-danger mt-3">
                <span th:errors="*{username}"></span>
            </div>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">비밀번호</label>
            <input type="password" class="form-control" th:field="*{password}" required>
            <div th:if="${#fields.hasErrors('password')}" class="alert alert-danger mt-3">
                <span th:errors="*{password}"></span>
            </div>
        </div>
        <div class="mb-3">
            <label for="name" class="form-label">이름</label>
            <input type="text" class="form-control" th:field="*{name}" required>
            <div th:if="${#fields.hasErrors('name')}" class="alert alert-danger mt-3">
                <span th:errors="*{name}"></span>
            </div>
        </div>
        <div class="mb-3">
            <label for="genderType" class="form-label">성별</label>
            <select class="form-select" th:field="*{genderType}" required>
                <option value="">-선택-</option>
                <option value="MALE">남성</option>
                <option value="FEMALE">여성</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="birthDate" class="form-label">생년월일</label>
            <input type="date" class="form-control" th:field="*{birthDate}" required>
            <div th:if="${#fields.hasErrors('birthDate')}" class="alert alert-danger mt-3">
                <span th:errors="*{birthDate}"></span>
            </div>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">이메일</label>
            <input type="email" class="form-control" th:field="*{email}" required>
            <div th:if="${#fields.hasErrors('email')}" class="alert alert-danger mt-3">
                <span th:errors="*{email}"></span>
            </div>
        </div>
        <button type="submit" class="btn btn-primary">가입하기</button>
    </form>
</div>

<!-- Bootstrap JS 및 의존성 스크립트 추가 -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
